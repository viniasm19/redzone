<div class="page">
<div class="coluna-media area-container">
  <h2 class="page-title">Minha Área</h2>

  <!-- Dados do usuário e botões. -->
  <div class="card area-card">

    <p class="dado">
      <span>Nome</span>
      <strong>{{ auth.usuarioLogado()?.nome }}</strong>
    </p>

    <p class="dado">
      <span>Email</span>
      <strong>{{ auth.usuarioLogado()?.email }}</strong>
    </p>

    <div class="acoes">
      <button class="btn-primario btn-principal" routerLink="/">Continuar Comprando</button>
      <button class="btn-secundario" (click)="sair()">Sair</button>
            @if (auth.isAdmin()) {
        <button class="btn-secundario" routerLink="/estoque">Estoque</button>
      }
    </div>
  </div>
</div>
</div>
