<div class="page usuarios-container">

  <h1 class="page-title">Usuários</h1>

  <p class="erro" *ngIf="erro && !usuarioEditando">{{ erro }}</p>

  <div
    class="usuario-card"
    *ngFor="let usuario of usuarios"
  >

    <h3>{{ usuario.nome }}</h3>

    <p>{{ usuario.email }}</p>

    <div class="acoes">

      <button
        class="btn-editar btn-secundario"
        (click)="editar(usuario)"
      >
        Editar
      </button>

      <button
        class="btn-excluir btn-secundario"
        (click)="excluir(usuario.id!)"
      >
        Excluir
      </button>

    </div>

  </div>

</div>

<!-- FORM EDITAR -->

<div
  class="page coluna-estreita editar-box"
  *ngIf="usuarioEditando"
>

  <h2>Editar Usuário</h2>

  <input
    class="campo"
    type="text"
    [(ngModel)]="usuarioEditando.nome"
    placeholder="Nome"
  />

  <input
    class="campo"
    type="email"
    [(ngModel)]="usuarioEditando.email"
    placeholder="Email"
  />

  <input
    class="campo"
    type="password"
    [(ngModel)]="usuarioEditando.senha"
    placeholder="Senha (mínimo 4 caracteres)"
  />

  <p class="erro" *ngIf="erro">{{ erro }}</p>

  <button class="btn-principal" (click)="salvarEdicao()">
    Salvar Alterações
  </button>

  <button class="btn-secundario" (click)="cancelar()">
    Cancelar
  </button>

</div>
