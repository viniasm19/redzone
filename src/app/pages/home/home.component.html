<!-- Banner do topo. -->
<section class="page hero-wrap">
  <div class="hero">
    <div class="hero-content">
      <span class="hero-etiqueta">Setup gamer & tech</span>
      <h1><span>RED</span>ZONE</h1>

      <p>Domine o jogo com equipamentos que combinam performance e estilo.</p>
      <div class="hero-actions">
                <button type="button" class="btn-principal" (click)="irParaProdutos()">
          Ver Produtos
        </button>
        <a routerLink="/cart" class="btn-hero-secundario">
          Ir para Carrinho
        </a>
      </div>
    </div>

        <img class="hero-imagem" src="/img/produtos/headset.jpg" alt="" />
  </div>
</section>

<!-- Vitrine: categorias e produtos. -->
<section class="page layout" id="produtos">
  <div class="vitrine-topo">
    <h2 class="page-title">Produtos</h2>
    <!-- Botões de categoria. -->
    <ul class="cat-list" aria-label="Categorias">
      <li *ngFor="let c of categorias">
                <button type="button" class="cat-btn" [class.active]="c === categoriaSelecionada"
          (click)="selecionarCategoria(c)">
          {{ c }}
        </button>
      </li>
    </ul>
  </div>

  <div class="content">
        <!-- Lista de produtos (filtrada pela categoria). -->
        <app-product-list [categoriaSelecionada]="categoriaSelecionada"></app-product-list>
  </div>
</section>
