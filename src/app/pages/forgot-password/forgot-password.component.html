<div class="page">
  <div class="auth-card">
    <h2>🔑 Resetar Senha</h2>
    <p class="muted">Digite seu email e a nova senha.</p>

    <form #f="ngForm" (ngSubmit)="resetar(f)" novalidate>
      <label>
        Email
        <input name="email" type="email" [(ngModel)]="email" #emailCtrl="ngModel"
               required email pattern="[^\s@]+@[^\s@]+\.[^\s@]+" placeholder="seu@email.com" />
        <small class="field-error" *ngIf="emailCtrl.invalid && (emailCtrl.touched || f.submitted)">
          {{ emailCtrl.errors?.['required'] ? 'Informe seu email.' : 'Digite um email válido.' }}
        </small>
      </label>

      <label>
        Nova Senha
        <input name="novaSenha" type="password" [(ngModel)]="novaSenha" #senhaCtrl="ngModel"
               required minlength="4" placeholder="Mínimo 4 caracteres" />
        <small class="field-error" *ngIf="senhaCtrl.invalid && (senhaCtrl.touched || f.submitted)">
          A senha deve ter pelo menos 4 caracteres.
        </small>
      </label>

      <div class="error" *ngIf="erro">{{ erro }}</div>
      <div class="success" *ngIf="sucesso">{{ sucesso }}</div>

      <button type="submit" class="btn">Atualizar Senha</button>
    </form>

    <div class="links">
      <a routerLink="/login">Voltar ao Login</a>
    </div>
  </div>
</div>
