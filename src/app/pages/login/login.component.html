<!-- Tela de login. Usa do TypeScript: email, senha, erro, erroEmail, returnUrl e entrar(f).
     #f="ngForm" dá o nome "f" ao formulário; (ngSubmit) chama entrar(f) ao clicar em Entrar ou apertar Enter.
     novalidate: desliga os balões de erro do navegador (os avisos são os nossos, em <small>).
     #emailCtrl / #senhaCtrl: apelidos para cada campo, usados para saber se ele foi tocado (touched). -->
<div class="page">
  <div class="coluna-estreita card auth-card">
    <h2 class="page-title">Login</h2>
    <p class="page-subtitle">Acesse para finalizar sua compra.</p>

    <form #f="ngForm" (ngSubmit)="entrar(f)" novalidate>
      <label>
        Email
        <input name="email" type="email" [(ngModel)]="email" #emailCtrl="ngModel"
               placeholder="seu@email.com" />
        <small class="field-error" *ngIf="erroEmail && (emailCtrl.touched || f.submitted)">
          {{ erroEmail }}
        </small>
      </label>

      <label>
        Senha
        <input name="senha" type="password" [(ngModel)]="senha" #senhaCtrl="ngModel" required />
        <small class="field-error" *ngIf="senhaCtrl.invalid && (senhaCtrl.touched || f.submitted)">
          Informe sua senha.
        </small>
      </label>

      <div class="error" *ngIf="erro">{{ erro }}</div>

      <button type="submit" class="btn">Entrar</button>
    </form>

    <!-- Os links levam o returnUrl junto: assim quem veio do checkout volta para ele no fim -->
    <div class="links">
      <a routerLink="/cadastro" [queryParams]="returnUrl ? { returnUrl: returnUrl } : {}">Criar conta</a>
      <span class="dot">•</span>
      <a routerLink="/forgot-password" [queryParams]="returnUrl ? { returnUrl: returnUrl } : {}">Esqueceu a senha?</a>
      <span class="dot">•</span>
      <a routerLink="/">Voltar</a>
    </div>
  </div>
</div>
