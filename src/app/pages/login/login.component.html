<div class="page">
  <div class="auth-card">
    <h2>Login</h2>
    <p class="muted">Acesse para finalizar sua compra.</p>

    <form #f="ngForm" (ngSubmit)="entrar(f)" novalidate>
      <label>
        Email
        <input name="email" type="email" [(ngModel)]="email" #emailCtrl="ngModel"
               required email pattern="[^\s@]+@[^\s@]+\.[^\s@]+" placeholder="seu@email.com" />
        <small class="field-error" *ngIf="emailCtrl.invalid && (emailCtrl.touched || f.submitted)">
          {{ emailCtrl.errors?.['required'] ? 'Informe seu email.' : 'Digite um email válido.' }}
        </small>
      </label>

      <label>
        Senha
        <input name="senha" type="password" [(ngModel)]="senha" #senhaCtrl="ngModel" required />
        <small class="field-error" *ngIf="senhaCtrl.invalid && (senhaCtrl.touched || f.submitted)">
          Informe sua senha.
        </small>
      </label>

      <div class="error" *ngIf="erro">{{ erro }}</div>

      <button type="submit" class="btn">Entrar</button>
    </form>

    <div class="links">
      <a routerLink="/cadastro" [queryParams]="returnUrl ? { returnUrl: returnUrl } : {}">Criar conta</a>
      <span class="dot">•</span>
      <a routerLink="/forgot-password">Esqueceu a senha?</a>
      <span class="dot">•</span>
      <a routerLink="/">Voltar</a>
    </div>
  </div>
</div>
