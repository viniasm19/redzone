<div class="detail-container" *ngIf="produto">
  <button class="btn-voltar" (click)="voltar()">← Voltar</button>

  <div class="detail-card">
    <img [src]="produto.imagem" [alt]="produto.nome" />
    <div class="detail-info">
      <span class="categoria">{{ produto.categoria }}</span>
      <h1>{{ produto.nome }}</h1>
      <p class="descricao">{{ produto.descricao }}</p>
      <p class="preco">R$ {{ produto.preco }}</p>

      @if (produto.estoque === 0) {
        <p class="estoque estoque-zero">Produto esgotado</p>
      } @else if (produto.estoque <= estoqueMinimo) {
        <p class="estoque estoque-baixo">Corra! Só restam {{ produto.estoque }} unidade(s).</p>
      } @else {
        <p class="estoque estoque-ok">{{ produto.estoque }} unidades em estoque</p>
      }

      <button class="btn-primary" (click)="adicionarAoCarrinho()" [disabled]="produto.estoque === 0">
        {{ produto.estoque === 0 ? 'Indisponível' : '🛒 Adicionar ao Carrinho' }}
      </button>
    </div>
  </div>
</div>
