<!-- Rodapé: nome, endereço e contato. -->
<footer class="rodape">
  <div class="rodape-conteudo">
    <div class="logo">RED<span>ZONE</span></div>

    <address class="contato">
      <span>{{ loja.endereco }}</span>
      <a [href]="loja.telefoneLink">{{ loja.telefone }}</a>
      <a [href]="'mailto:' + loja.email">{{ loja.email }}</a>
    </address>
  </div>

    <p class="copyright"><span>© {{ ano }} {{ loja.nome }} · Projeto acadêmico — Centro Universitário Senac</span></p>
</footer>
