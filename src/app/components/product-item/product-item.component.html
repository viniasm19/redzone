<!-- Card de um produto (clique abre o detalhe). -->
<div class="product-card" [class.esgotado]="produto.estoque === 0"
     [routerLink]="['/product', produto.id]">

    <!-- Foto do produto. -->
    <div class="foto">
    <img [src]="produto.imagem || 'https://images.unsplash.com/photo-1542751371-adc38448a05e?q=80&w=2070'"
         [alt]="produto.nome" loading="lazy" />
  </div>

  <!-- Nome, preço e estoque. -->
  <div class="info">
    <p class="categoria">{{ produto.categoria }}</p>
    <h3>{{ produto.nome }}</h3>

    <p class="preco">R$ {{ produto.preco }}</p>

        @if (produto.estoque === 0) {
      <p class="estoque estoque-zero">Esgotado</p>
    } @else if (produto.estoque <= estoqueMinimo) {
      <p class="estoque estoque-baixo">Últimas {{ produto.estoque }} unidade(s)!</p>
    } @else {
      <p class="estoque estoque-ok">Em estoque</p>
    }

    <!-- Botão de adicionar ao carrinho. -->
    <button class="btn-comprar" [disabled]="produto.estoque === 0"
            (click)="adicionar(); $event.stopPropagation()">
      {{ produto.estoque === 0 ? 'Indisponível' : 'Adicionar ao Carrinho' }}
    </button>
  </div>
</div>
