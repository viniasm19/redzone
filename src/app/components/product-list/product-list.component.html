<div class="vitrine-container">

  <h2>🔥 Equipamentos Disponíveis</h2>

  <!-- 🔝 LISTA DE PRODUTOS -->
  <div class="products-grid">

    <div *ngFor="let prod of produtos; trackBy: trackById">

      <!-- CARD -->
      <app-product-item [produto]="prod" (addToCart)="adicionarAoCarrinho($event)">
      </app-product-item>

      <!-- AÇÕES -->
      <div class="actions" *ngIf="isAdmin()">
        <button (click)="editarProduto(prod)">
          ✏️ Editar
        </button>

        <button (click)="deleteProduto(prod.id)">
          🗑️ Excluir
        </button>

      </div>

    </div>

  </div>

  <!-- 🔻 FORMULÁRIO -->
  <div class="form-container" *ngIf="isAdmin()">

    <h3>{{ editandoId ? '✏️ Editar Produto' : '➕ Cadastrar Produto' }}</h3>

    <input type="text" placeholder="Nome do produto" [(ngModel)]="novoProduto.nome">

    <input type="number" placeholder="Preço" [(ngModel)]="novoProduto.preco">

    <input type="text" placeholder="Imagem (ex.: /img/produtos/headset.jpg)" [(ngModel)]="novoProduto.imagem">

    <select [(ngModel)]="novoProduto.categoria">

      <option value="" disabled selected>
        Selecione a categoria
      </option>

      <option *ngFor="let cat of categorias" [value]="cat">
        {{ cat }}
      </option>

    </select>

    <!-- Detalhes opcionais: se ficarem vazios, a tela de detalhe não mostra a seção -->
    <input type="text" placeholder="Marca (opcional)" [(ngModel)]="novoProduto.marca">

    <input type="text" placeholder="Garantia (opcional, ex.: 12 meses)" [(ngModel)]="novoProduto.garantia">

    <textarea rows="4" placeholder="Especificações (opcional, uma por linha, ex.: Conexão: USB)"
              [(ngModel)]="novoProduto.especificacoes"></textarea>

    <label class="rotulo" for="preco-promocional">Preço promocional (vazio = sem promoção)</label>
    <input id="preco-promocional" type="number" min="0" step="0.01" placeholder="Preço promocional"
           [(ngModel)]="novoProduto.precoPromocional">

    <!-- Estoque inicial só no cadastro. Depois, entrada/saída é pela tela de Estoque. -->
    <ng-container *ngIf="!editandoId">
      <label class="rotulo" for="estoque-inicial">Estoque inicial</label>
      <input id="estoque-inicial" type="number" min="0" step="1" placeholder="Estoque inicial"
             [(ngModel)]="novoProduto.estoque">
    </ng-container>

    <p class="dica" *ngIf="editandoId">
      Para mudar a quantidade em estoque, use a tela <a routerLink="/estoque">📦 Estoque</a>.
    </p>


    <p class="erro" *ngIf="erro">{{ erro }}</p>

    <button (click)="addProduto()">
      {{ editandoId ? '💾 Salvar alterações' : '💾 Adicionar Produto' }}
    </button>

    <button *ngIf="editandoId" (click)="resetForm()">
      ✖ Cancelar edição
    </button>

  </div>

</div>
