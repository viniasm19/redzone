<!-- Cabeçalho: logo, carrinho e conta. -->
<header class="header">
  <div class="header-conteudo">
    <a class="logo" routerLink="/" (click)="fecharMenu()" aria-label="RedZone, página inicial">
      RED<span>ZONE</span>
    </a>

        <!-- Botão ☰ (só no celular). -->
        <button type="button" class="btn-menu" (click)="alternarMenu()"
            [attr.aria-expanded]="menuAberto()" aria-controls="menu-principal"
            [attr.aria-label]="menuAberto() ? 'Fechar menu' : 'Abrir menu'">
      {{ menuAberto() ? '✕' : '☰' }}
    </button>

    <!-- Links do menu. -->
    <nav id="menu-principal" class="menu" [class.aberto]="menuAberto()">
            <div class="menu-grupo">
        <!-- Link do carrinho com o contador. -->
        <a routerLink="/cart" routerLinkActive="active" class="cart-btn" (click)="fecharMenu()">
                    <svg class="icone" viewBox="0 0 24 24" width="20" height="20" aria-hidden="true">
            <path d="M6 7h12l-1 13H7L6 7Z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/>
            <path d="M9 7a3 3 0 0 1 6 0" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
          </svg>
          Carrinho
          <span class="badge" *ngIf="cartService.quantidadeTotal() > 0">
            {{ cartService.quantidadeTotal() }}
          </span>
        </a>
      </div>

            <div class="menu-grupo conta">
        <!-- Quem não está logado: Login e Cadastro. -->
        <ng-container *ngIf="!isLogado()">
          <a routerLink="/login" routerLinkActive="active" (click)="fecharMenu()">Login</a>
          <a routerLink="/cadastro" routerLinkActive="active" class="destaque" (click)="fecharMenu()">Cadastro</a>
        </ng-container>

        <!-- Quem está logado: nome, Minha Área e Sair. -->
        <ng-container *ngIf="isLogado()">
          <span class="ola">Olá, {{ usuario()?.nome }}</span>
          <a class="profile" routerLink="/area-usuario" routerLinkActive="active" (click)="fecharMenu()">Minha Área</a>
          <a class="profile" href="#" (click)="sair(); $event.preventDefault()">Sair</a>
        </ng-container>
      </div>
    </nav>
  </div>
</header>
