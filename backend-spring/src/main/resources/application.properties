spring.application.name=redzone-api

# O front-end Angular chama a API nesta porta
server.port=8080

# Banco H2 em ARQUIVO.
# (o caminho "./data" é relativo à pasta de onde a API é iniciada.
spring.datasource.url=jdbc:h2:file:./data/redzone
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Console do H2: http://localhost:8080/h2-console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# update: o Hibernate cria as tabelas que faltam e NÃO apaga os dados.
spring.jpa.hibernate.ddl-auto=update

# Não roda o data.sql automaticamente.
# Quem carrega os dados de exemplo, só na primeira vez, é a classe DataLoader.
spring.sql.init.mode=never

# Mostra o SQL no terminal (útil para estudar).
spring.jpa.show-sql=true
