spring.application.name=redzone-api

# O front-end Angular chama a API nesta porta
server.port=8080

# Banco H2 em memória (zera a cada reinício; data.sql recarrega os dados de teste)
spring.datasource.url=jdbc:h2:mem:redzone;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Console do H2: http://localhost:8080/h2-console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# O Hibernate cria as tabelas e, depois, o data.sql insere os dados
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always
spring.sql.init.encoding=UTF-8
spring.jpa.show-sql=true
