<div class="area-container">
  <div class="area-card">
    <h2>👤 Minha Área</h2>

    <p class="dado">
      <span>Nome</span>
      <strong>{{ auth.usuarioLogado()?.nome }}</strong>
    </p>

    <p class="dado">
      <span>Email</span>
      <strong>{{ auth.usuarioLogado()?.email }}</strong>
    </p>

    <div class="acoes">
      <button class="btn-primario" routerLink="/">🛍️ Continuar Comprando</button>
      <button class="btn-secundario" (click)="sair()">Sair</button>
    </div>
  </div>
</div>
