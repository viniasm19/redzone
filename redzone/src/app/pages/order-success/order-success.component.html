<div class="success-container">

    <div class="success-card">
        <div class="success-icon">✅</div>

        <h1>Pedido Confirmado!</h1>
        <p>Obrigado pela sua compra, <strong>{{ auth.usuarioLogado()?.nome }}</strong>!</p>
        <p class="muted">Seu pedido foi recebido com sucesso.</p>

        <div class="success-actions">
            <button class="btn-continuar" (click)="continuar()">
                🛍️ Continuar Comprando
            </button>

            <button class="btn-secundario" (click)="irParaAreaUsuario()">
                👤 Minha Área
            </button>
        </div>
    </div>
</div>
